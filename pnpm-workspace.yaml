  - "packages/*"

# pnpm 11+ build-script allowlist (replaces package.json pnpm.onlyBuiltDependencies)
allowBuilds:
  core-js: true
  electron: true
  esbuild: true
  sharp: true
  unrs-resolver: true

patchedDependencies:
