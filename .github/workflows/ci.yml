name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Required check name for branch protection / rulesets: "quality"
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Dependency audit
        # next pins an older postcss; forcing newer postcss breaks Tailwind v4 / Turbopack CSS.
        run: >
          pnpm audit --prod --audit-level high
          --ignore GHSA-6g55-p6wh-862q
          --ignore GHSA-r28c-9q8g-f849
          --ignore GHSA-f88m-g3jw-g9cj

      - name: Check generated/release hygiene
        run: |
          pnpm format:check
          git diff --check
          node scripts/check-no-secrets.mjs

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud

  # GitHub only lets later jobs (including tag Product Release) restore caches
  # written on the default branch. Warm Gradle + Android deps on main so APK
  # tags are not a cold download every time.
  android-gradle-cache:
    name: Seed Android Gradle cache
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.18.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync Capacitor Android shell
        run: pnpm mobile:sync

      - name: Setup Android build cache
        uses: ./.github/actions/setup-android-build
        with:
          cache-read-only: "false"

      - name: Download Android dependencies
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon
