name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

# Required check name for branch protection / rulesets: "quality"
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Dependency audit
        # next pins an older postcss; forcing newer postcss breaks Tailwind v4 / Turbopack CSS.
        run: >
          pnpm audit --prod --audit-level high
          --ignore GHSA-6g55-p6wh-862q
          --ignore GHSA-r28c-9q8g-f849
          --ignore GHSA-f88m-g3jw-g9cj

      - name: Check generated/release hygiene
        run: |
          pnpm format:check
          git diff --check
          node scripts/check-no-secrets.mjs

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://placeholder.convex.cloud
