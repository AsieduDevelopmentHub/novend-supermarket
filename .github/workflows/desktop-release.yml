name: Product Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
      channel:
        description: "Release channel published to Convex"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta
      mandatory:
        description: "Mark update as mandatory"
        required: false
        default: false
        type: boolean
      targets:
        description: "What to build and publish to Convex"
        required: false
        default: all
        type: choice
        options:
          - all
          - android

concurrency:
  group: product-release-${{ github.ref }}
  cancel-in-progress: false

# Default deny; jobs that publish releases elevate contents:write.
permissions:
  contents: read

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve release targets
        id: targets
        shell: bash
        run: |
          targets="${{ github.event.inputs.targets }}"
          if [ -z "$targets" ]; then
            # Tag pushes build every platform and publish Convex metadata.
            targets="all"
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Release targets: $targets"

      - name: Tag must match package versions
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          root="v$(node -p "require('./package.json').version")"
          desktop="v$(node -p "require('./apps/desktop/package.json').version")"
          mobile="v$(node -p "require('./apps/mobile/package.json').version")"
          ok=1
          if [ "$tag" != "$root" ]; then
            echo "Tag $tag does not match root package version $root" >&2
            ok=0
          fi
          if [ "$tag" != "$desktop" ]; then
            echo "Tag $tag does not match desktop package version $desktop (electron-builder publishes this release)" >&2
            ok=0
          fi
          if [ "$tag" != "$mobile" ]; then
            echo "Tag $tag does not match mobile package version $mobile" >&2
            ok=0
          fi
          if [ "$ok" -ne 1 ]; then
            exit 1
          fi
          echo "Tag $tag matches root, desktop, and mobile package versions."

  github-release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub Release $tag already exists"
            exit 0
          fi
          gh release create "$tag" \
            --title "Novend POS $tag" \
            --notes "See CHANGELOG.md" \
            --verify-tag

      - name: Sync GitHub Release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/sync-github-release-notes.mjs

  build:
    name: Build ${{ matrix.os }}
    needs: verify
    if: needs.verify.outputs.targets == 'all'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Report desktop config (no secret values)
        shell: bash
        env:
          NOVEND_APP_URL: ${{ secrets.NOVEND_APP_URL }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          DESKTOP_RELEASE_PUBLISH_SECRET: ${{ secrets.DESKTOP_RELEASE_PUBLISH_SECRET }}
        run: |
          if [ -n "$NOVEND_APP_URL" ]; then echo "NOVEND_APP_URL → configured"; else echo "NOVEND_APP_URL → unset (packaging default https://novend-pos.vercel.app)"; fi
          if [ -n "$CONVEX_SITE_URL" ]; then echo "CONVEX_SITE_URL → configured"; else echo "CONVEX_SITE_URL → missing"; fi
          if [ -n "$DESKTOP_RELEASE_PUBLISH_SECRET" ]; then echo "DESKTOP_RELEASE_PUBLISH_SECRET → configured"; else echo "DESKTOP_RELEASE_PUBLISH_SECRET → missing"; fi

      - name: Build installers
        run: pnpm desktop:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVEND_APP_URL: ${{ secrets.NOVEND_APP_URL }}
          NOVEND_CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          # P1-1 BLOCKER: desktop Authenticode / Apple notarization not configured.
          # Do not claim signed desktop releases until credentials + verification exist.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: novend-pos-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.yml
          if-no-files-found: warn
          retention-days: 14

  build-android:
    name: Build Android APK
    needs: [verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.18.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Android build cache
        uses: ./.github/actions/setup-android-build
        with:
          # Tag refs cannot seed a cache that later tags can read. Restore
          # the Gradle User Home written by CI on main.
          cache-read-only: "true"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Sync Capacitor Android shell
        run: pnpm mobile:sync
        env:
          NOVEND_APP_URL: ${{ secrets.NOVEND_APP_URL }}
          NOVEND_MOBILE_BUILD: production

      - name: Verify baked mobile origin
        run: pnpm mobile:verify-origin
        env:
          NOVEND_APP_URL: ${{ secrets.NOVEND_APP_URL }}
          NOVEND_MOBILE_BUILD: production

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 repository secret is required for signed release APKs" >&2
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/mobile/android/release.keystore
          chmod 600 apps/mobile/android/release.keystore
          echo "ANDROID_KEYSTORE_PATH=$PWD/apps/mobile/android/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NOVEND_APP_URL: ${{ secrets.NOVEND_APP_URL }}
          NOVEND_MOBILE_BUILD: production
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK provenance
        shell: bash
        run: |
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ -z "$ANDROID_KEYSTORE_PATH" ] || [ ! -f "$ANDROID_KEYSTORE_PATH" ]; then
            echo "Release keystore was not provisioned" >&2
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          [ -x "$apksigner" ] && [ -x "$aapt" ]
          "$apksigner" verify --verbose "$apk"
          sha256sum "$apk" | tee "$apk.sha256"
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          badging="$("$aapt" dump badging "$apk")"
          echo "$badging" | grep -F "package: name='com.novend.pos'"
          echo "$badging" | grep -F "versionName='$version'"

      - name: Prepare APK for GitHub Release
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          src="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "Release APK not found at $src" >&2
            ls -la apps/mobile/android/app/build/outputs/apk/release/ || true
            exit 1
          fi
          dest="NovendPOS-${version}-android.apk"
          cp "$src" "$dest"
          echo "APK_PATH=$dest" >> "$GITHUB_ENV"

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          for i in $(seq 1 60); do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "$APK_PATH" --clobber
              exit 0
            fi
            echo "Waiting for GitHub Release $tag (attempt $i)…"
            sleep 10
          done
          echo "Timed out waiting for GitHub Release $tag" >&2
          exit 1

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: novend-pos-android
          path: NovendPOS-*-android.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: novend-pos-android-checksum
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk.sha256

  publish-convex:
    name: Publish update metadata to Convex
    needs: [verify, github-release, build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Still publish mobile when desktop fails after an APK re-upload (clobber
    # invalidates the previous githubAssetId and 404s Convex downloads).
    if: |
      always() &&
      needs.verify.result == 'success' &&
      needs.github-release.result == 'success' &&
      (
        needs.build-android.result == 'success' ||
        (needs.verify.outputs.targets == 'all' && needs.build.result == 'success')
      )
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Wait for GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          for i in $(seq 1 30); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets | length')
            echo "Attempt $i: $count assets"
            if [ "$count" -gt 0 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for release assets" >&2
          exit 1

      # electron-builder often creates the Release with a bare version title and empty body.
      # Replace those with the matching CHANGELOG.md section before Convex publish reads notes.
      - name: Sync GitHub Release notes from CHANGELOG
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/sync-github-release-notes.mjs

      - name: Publish desktop metadata to Convex
        if: needs.verify.outputs.targets == 'all' && needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          DESKTOP_RELEASE_PUBLISH_SECRET: ${{ secrets.DESKTOP_RELEASE_PUBLISH_SECRET }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
          RELEASE_MANDATORY: ${{ github.event.inputs.mandatory || 'false' }}
        run: node scripts/publish-desktop-release-to-convex.mjs

      - name: Publish mobile metadata to Convex
        if: needs.build-android.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          DESKTOP_RELEASE_PUBLISH_SECRET: ${{ secrets.DESKTOP_RELEASE_PUBLISH_SECRET }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
          RELEASE_MANDATORY: ${{ github.event.inputs.mandatory || 'false' }}
          MOBILE_ANDROID_STORE_URL: ${{ secrets.MOBILE_ANDROID_STORE_URL }}
          MOBILE_IOS_STORE_URL: ${{ secrets.MOBILE_IOS_STORE_URL }}
        run: node scripts/publish-mobile-release-to-convex.mjs
