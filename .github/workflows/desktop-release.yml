name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
      channel:
        description: "Release channel published to Convex"
        required: false
        default: stable
        type: choice
        options:
          - stable
          - beta
      mandatory:
        description: "Mark update as mandatory"
        required: false
        default: false
        type: boolean

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Tag must match package version
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $tag does not match root package version $pkg" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Report desktop config (no secret values)
        shell: bash
        env:
          NOVEND_APP_URL: ${{ secrets.NOVEND_APP_URL }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          DESKTOP_RELEASE_PUBLISH_SECRET: ${{ secrets.DESKTOP_RELEASE_PUBLISH_SECRET }}
        run: |
          if [ -n "$NOVEND_APP_URL" ]; then echo "NOVEND_APP_URL → configured"; else echo "NOVEND_APP_URL → unset (packaging default https://novend-pos.vercel.app)"; fi
          if [ -n "$CONVEX_SITE_URL" ]; then echo "CONVEX_SITE_URL → configured"; else echo "CONVEX_SITE_URL → missing"; fi
          if [ -n "$DESKTOP_RELEASE_PUBLISH_SECRET" ]; then echo "DESKTOP_RELEASE_PUBLISH_SECRET → configured"; else echo "DESKTOP_RELEASE_PUBLISH_SECRET → missing"; fi

      - name: Build installers
        run: pnpm desktop:release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOVEND_APP_URL: ${{ secrets.NOVEND_APP_URL }}
          NOVEND_CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novend-pos-${{ matrix.os }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.yml
          if-no-files-found: warn
          retention-days: 14

  publish-convex:
    name: Publish update metadata to Convex
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Wait for GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          for i in $(seq 1 30); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets | length')
            echo "Attempt $i: $count assets"
            if [ "$count" -gt 0 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for release assets" >&2
          exit 1

      - name: Publish metadata to Convex
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          DESKTOP_RELEASE_PUBLISH_SECRET: ${{ secrets.DESKTOP_RELEASE_PUBLISH_SECRET }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
          RELEASE_MANDATORY: ${{ github.event.inputs.mandatory || 'false' }}
        run: node scripts/publish-desktop-release-to-convex.mjs
