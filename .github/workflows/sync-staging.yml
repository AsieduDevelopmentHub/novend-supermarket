name: Sync staging from main

# Release PRs squash staging → main (clean main). Staging then lacks that squash
# commit, so the next release would conflict. Merge main back into staging
# immediately. If this sync itself is a GitHub PR, use a merge commit — not squash.
on:
  push:
    branches: [main]

concurrency:
  group: sync-staging-from-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    name: Merge main into staging
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Merge and push, or open a PR if it conflicts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main staging
          git checkout -B staging origin/staging

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "staging already contains main"
            exit 0
          fi

          if git merge origin/main -m "Merge branch 'main' into staging"; then
            git push origin staging
            echo "Pushed merge of main into staging"
            exit 0
          fi

          git merge --abort
          echo "Merge conflict — opening a PR so it can be resolved on staging"
          open_count="$(gh pr list --base staging --head main --state open --json number --jq 'length')"
          if [ "$open_count" = "0" ]; then
            gh pr create --base staging --head main \
              --title "chore: sync main into staging" \
              --body "A squash-merge landed on main. Merge this into staging with a merge commit (not squash) so staging records that release commit and the next staging → main PR stays clean."
          else
            echo "A main → staging PR is already open"
          fi
