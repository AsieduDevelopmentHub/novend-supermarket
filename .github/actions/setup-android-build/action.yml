name: Setup Android build
description: JDK 21, Android SDK, and Gradle User Home cache for Capacitor APKs

inputs:
  cache-read-only:
    description: Restore the Gradle cache without writing it back. Tag builds must stay read-only so they reuse the main-seeded cache.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: "21"

    # Default packages include obsolete `tools` (removed from the SDK repo).
    # Install only platform-tools; Gradle resolves platforms/build-tools.
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      with:
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      with:
        cache-read-only: ${{ inputs.cache-read-only == 'true' }}
