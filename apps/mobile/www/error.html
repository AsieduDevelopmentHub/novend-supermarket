<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Novend POS</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1f33;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0;
        color: var(--muted);
        max-width: 28rem;
        line-height: 1.5;
      }
      button {
        margin-top: 1.25rem;
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #0b1f33;
        font: inherit;
        font-weight: 600;
        padding: 0.65rem 1.1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>Can’t reach Novend right now</h1>
        <p>
          The hosted app did not load. Check your connection, then try again. After one successful
          online open, this device can start from the local cache.
        </p>
        <button type="button" id="retry">Try again</button>
      </div>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.replace("/?stay=1");
      });
    </script>
  </body>
</html>
