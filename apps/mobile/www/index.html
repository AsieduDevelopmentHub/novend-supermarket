<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Novend POS</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1f33;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
        max-width: 28rem;
      }
      .spinner {
        width: 2rem;
        height: 2rem;
        margin: 0 auto 1.25rem;
        border: 2px solid rgba(148, 163, 184, 0.25);
        border-top-color: var(--accent);
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      button {
        margin-top: 1.25rem;
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #0b1f33;
        font: inherit;
        font-weight: 600;
        padding: 0.65rem 1.1rem;
        cursor: pointer;
      }
      .hidden {
        display: none !important;
      }
    </style>
    <script src="app-config.js"></script>
  </head>
  <body>
    <main>
      <div id="booting">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Opening Novend</h1>
        <p>Restoring your local workspace…</p>
      </div>
      <div id="failed" class="hidden">
        <h1>Can’t reach Novend right now</h1>
        <p id="failed-detail">
          After you open Novend once while online, this device starts from the cached workspace.
          Fully close the app, then try again if you just went offline. Connect if this is the first
          open on this phone.
        </p>
        <button type="button" id="retry">Try again</button>
      </div>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var appUrl = window.NOVEND_APP_URL;
        var allowedHosts = window.NOVEND_ALLOWED_HOSTS || [];
        var parsedAppUrl;
        try {
          parsedAppUrl = new URL(appUrl);
          if (
            parsedAppUrl.origin !== appUrl ||
            allowedHosts.indexOf(parsedAppUrl.hostname) < 0 ||
            (parsedAppUrl.protocol !== "https:" && parsedAppUrl.protocol !== "http:")
          ) {
            throw new Error("untrusted origin");
          }
        } catch (_error) {
          appUrl = "";
        }
        // Boot the app shell (same as Electron). Middleware sends signed-out users
        // to /login?fromBoot=1. Avoid /login as the default so authenticated opens
        // never paint the login brand chrome first.
        var requestedEntry = params.get("entry");
        var entry = window.NOVEND_APP_ENTRY || "/dashboard";
        // Extra query params (fromBoot) must still count as sign-out. Otherwise
        // boot ignores the entry and opens /dashboard, which paints Opening sign-in
        // and sends the WebView back here.
        if (
          requestedEntry === "/login?signedOut=1" ||
          (requestedEntry &&
            requestedEntry.indexOf("/login") === 0 &&
            requestedEntry.indexOf("signedOut=1") >= 0)
        ) {
          entry = "/login?signedOut=1";
        }
        // Open the hosted shell directly. /api/boot is network-only (SW skips
        // /api/*) so it can never succeed offline. After one online open the
        // hosted service worker serves Cache Storage; Dexie restores the session.
        var dest = appUrl
          ? appUrl + entry + (entry.indexOf("?") >= 0 ? "&" : "?") + "fromBoot=1"
          : "";

        var booting = document.getElementById("booting");
        var failed = document.getElementById("failed");
        var failedDetail = document.getElementById("failed-detail");
        var retry = document.getElementById("retry");
        var navigated = false;
        var stayOnBoot = params.get("stay") === "1";

        function showFailed(message) {
          booting.classList.add("hidden");
          failed.classList.remove("hidden");
          if (message && failedDetail) failedDetail.textContent = message;
        }

        function leaveBoot() {
          if (navigated) return;
          if (!dest) {
            showFailed("This Novend build does not contain a valid application origin.");
            return;
          }
          navigated = true;
          window.location.replace(dest);
        }

        retry.addEventListener("click", function () {
          failed.classList.add("hidden");
          booting.classList.remove("hidden");
          navigated = false;
          leaveBoot();
        });

        window.addEventListener("online", function () {
          if (navigated) return;
          failed.classList.add("hidden");
          booting.classList.remove("hidden");
          leaveBoot();
        });

        window.setTimeout(function () {
          if (!booting || booting.classList.contains("hidden")) return;
          var copy = booting.querySelector("p");
          if (copy) {
            copy.textContent =
              "Still opening the hosted app. The first emulator load can take a minute.";
          }
        }, 8000);

        if (stayOnBoot) {
          showFailed(
            "Novend could not open the local workspace. Connect once while online, then this device can start without a signal.",
          );
        } else {
          leaveBoot();
        }
      })();
    </script>
  </body>
</html>
