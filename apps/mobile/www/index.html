<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Novend POS</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1f33;
        --fg: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.5;
        max-width: 28rem;
      }
      .spinner {
        width: 2rem;
        height: 2rem;
        margin: 0 auto 1.25rem;
        border: 2px solid rgba(148, 163, 184, 0.25);
        border-top-color: var(--accent);
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      button {
        margin-top: 1.25rem;
        appearance: none;
        border: 0;
        border-radius: 0.5rem;
        background: var(--accent);
        color: #0b1f33;
        font: inherit;
        font-weight: 600;
        padding: 0.65rem 1.1rem;
        cursor: pointer;
      }
      .hidden {
        display: none !important;
      }
    </style>
    <script src="app-config.js"></script>
  </head>
  <body>
    <main>
      <div id="booting">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Opening Novend</h1>
        <p>Restoring your local workspace…</p>
      </div>
      <div id="failed" class="hidden">
        <h1>Can’t reach Novend right now</h1>
        <p id="failed-detail">
          Check your internet connection, then try again. After you open Novend once while online,
          this device can start from the local cache.
        </p>
        <button type="button" id="retry">Try again</button>
      </div>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var appUrl = (
          params.get("appUrl") ||
          window.NOVEND_APP_URL ||
          "https://novend-pos.vercel.app"
        ).replace(/\/$/, "");
        // Prefer /login — always returns HTML when signed out. Booting /dashboard
        // triggers an auth 307 that Android WebView often surfaces as net::ERR_FAILED.
        var entry = params.get("entry") || window.NOVEND_APP_ENTRY || "/login";
        if (entry.charAt(0) !== "/") entry = "/" + entry;
        var sep = entry.indexOf("?") >= 0 ? "&" : "?";
        var target = appUrl + entry + sep + "fromBoot=1";

        var booting = document.getElementById("booting");
        var failed = document.getElementById("failed");
        var failedDetail = document.getElementById("failed-detail");
        var retry = document.getElementById("retry");
        var navigated = false;
        var settled = false;

        function showFailed(message) {
          settled = true;
          booting.classList.add("hidden");
          failed.classList.remove("hidden");
          if (message && failedDetail) failedDetail.textContent = message;
        }

        function leaveBoot() {
          navigated = true;
          window.location.replace(target);
        }

        function go() {
          if (navigator.onLine === false) {
            // Still attempt — HTTP/SW cache may serve the hosted origin.
            // If WebView stays on the local boot host, show a friendly error
            // instead of Chromium's net::ERR_FAILED page.
            leaveBoot();
            return;
          }

          // Prefetch so a dead network fails on our UI, not the system error page.
          var controller = typeof AbortController !== "undefined" ? new AbortController() : null;
          var timer = window.setTimeout(function () {
            if (controller) controller.abort();
          }, 8000);

          fetch(target, {
            method: "GET",
            credentials: "include",
            cache: "no-store",
            redirect: "follow",
            signal: controller ? controller.signal : undefined,
          })
            .then(function () {
              window.clearTimeout(timer);
              leaveBoot();
            })
            .catch(function () {
              window.clearTimeout(timer);
              // Last try — SW/http cache may still succeed.
              leaveBoot();
            });
        }

        retry.addEventListener("click", function () {
          failed.classList.add("hidden");
          booting.classList.remove("hidden");
          settled = false;
          navigated = false;
          go();
        });

        window.setTimeout(function () {
          if (settled) return;
          var host = window.location.hostname;
          if (host === "localhost" || host === "capacitor" || window.location.protocol === "file:") {
            showFailed(
              navigator.onLine === false
                ? "This device looks offline. Connect to the internet and try again."
                : "Novend could not open. Check your connection and try again.",
            );
          }
        }, 10000);

        go();
      })();
    </script>
  </body>
</html>
